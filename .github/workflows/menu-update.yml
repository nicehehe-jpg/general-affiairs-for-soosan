name: 식단표 자동 업데이트

on:
  schedule:
    - cron: '0 0 * * 5'   # 매주 금요일 09:00 KST (UTC 00:00)
  workflow_dispatch: {}    # GitHub Actions 탭에서 수동 실행도 가능

permissions:
  contents: write

concurrency:
  group: menu-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 최신 주간 식단표 반영
        run: node .github/scripts/update-menu.js

      - name: 변경 있으면 커밋 & 배포
        run: |
          if [ -n "$(git status --porcelain index.html)" ]; then
            git config user.name "menu-update-bot"
            git config user.email "actions@users.noreply.github.com"
            git add index.html
            git commit -m "chore: 매곡테크노파크 식단표 자동 업데이트 ($(date -u +%Y-%m-%d))"
            git push
            echo "✅ 식단표 업데이트 & 배포됨"
          else
            echo "변경 없음 — 이미 최신"
          fi
